name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: استخراج پروژه Android
        run: |
          mkdir -p project
          unzip -q SnappDriverAI-v0.2-Android.zip -d project

      - name: پیدا کردن پوشه پروژه
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project was not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: اصلاح سازگاری JVM
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("${{ env.PROJECT_DIR }}/app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          if "compileOptions {" not in text:
              marker = "android {"

              addition = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

              text = text.replace(marker, addition, 1)

          if "jvmToolchain(17)" not in text:
              text += """

          kotlin {
              jvmToolchain(17)
          }
          """

          p.write_text(text, encoding="utf-8")
          PY

      - name: ساخت Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.9

      - name: ساخت APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        with:
          name: SnappDriverAI-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
